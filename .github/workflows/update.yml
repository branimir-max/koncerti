name: Osvježi koncerte

on:
  schedule:
    - cron: "17 4 * * *"   # svaki dan oko 5–6 h po zagrebačkom vremenu
  workflow_dispatch:        # ručno pokretanje iz kartice Actions
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Skupi podatke
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[skupi]')
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
        run: |
          python -m scrapers.run
          python -m scrapers.festivals || echo "Robot za festivale nije uspio"

      - name: Izgradi stranicu
        run: python build.py

      - name: Podaci o izvođačima (MusicBrainz)
        if: github.event_name != 'push'
        run: python -m scrapers.enrich && python build.py && python -m scrapers.eventlinks && python build.py

      - name: Spremi nove podatke
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[skupi]')
        run: |
          git config user.name "koncerti-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p data/probe && touch data/probe/.keep
          git add data/scraped data/report.json data/probe data/seen.json data/artists.json data/eventlinks.json data/festivals.json data/festivals-report.json
          git diff --cached --quiet || git commit -m "Podaci: $(date -u +%F)"
          # neuspjelo spremanje podataka ne smije zaustaviti objavu stranice
          git pull --rebase -q || true
          git push || echo "::warning::Podaci nisu spremljeni u repozitorij (stranica se svejedno objavljuje)"

      # Snimke stranica izvora za popravljanje skupljača: samo kao privitak radu, ne u repozitorij
      # (tuđe stranice znaju sadržavati ključeve koje GitHub s pravom blokira)
      - name: Snimke izvora
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: data/debug
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
