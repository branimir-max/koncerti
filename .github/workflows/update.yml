name: Osvježi koncerte

on:
  schedule:
    - cron: "17 4 * * *"   # svaki dan oko 5–6 h po zagrebačkom vremenu
  workflow_dispatch:        # ručno pokretanje iz kartice Actions
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Skupi podatke
        if: github.event_name != 'push'
        run: python -m scrapers.run

      - name: Izgradi stranicu
        run: python build.py

      - name: Podaci o izvođačima (MusicBrainz)
        if: github.event_name != 'push'
        run: python -m scrapers.enrich && python build.py && python -m scrapers.eventlinks && python build.py

      - name: Spremi nove podatke
        if: github.event_name != 'push'
        run: |
          git config user.name "koncerti-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/scraped data/report.json data/debug data/seen.json data/artists.json data/eventlinks.json
          git diff --cached --quiet || git commit -m "Podaci: $(date -u +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
